<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ | wellea</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      color: #24202a;
      background: #fff;
    }

    header {
      padding: 22px 24px;
      border-bottom: 1px solid #eee;
    }

    .logo {
      color: #24202a;
      text-decoration: none;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .news {
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 18px;
    }

    .kicker {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      color: #888;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 0 0 40px;
    }

    .news-list {
      display: flex;
      flex-direction: column;
    }

    .news-item {
      padding: 22px 0;
      border-bottom: 1px solid #ddd;
    }

    .news-date {
      font-size: 14px;
      color: #777;
      margin-bottom: 8px;
    }

    .news-title {
      font-size: 18px;
      font-weight: 600;
    }

    @media (max-width: 650px) {
      .news {
        padding: 35px 18px;
      }

      h1 {
        font-size: 34px;
      }

      .news-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">wellea</a>
  </header>

  <main class="news">
    <div class="kicker">News</div>
    <h1>お知らせ</h1>

    <div class="news-list" id="news-list"></div>
    <a href="news.html" class="news-more">一覧を見る</a>
  </main>
<script src="news.js"></script>
</body>
</html>
